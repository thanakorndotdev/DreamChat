name: dreamchat

services:
  app:
    build: .
    container_name: dreamchat-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-longrak}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-longrak}
      # Server-side pin: the API routes ignore the Host URL typed in the browser.
      - OLLAMA_URL=http://ollama:11434
      # Model for Ollama when Workers AI isn't set (the browser can't pick one on a deployed server).
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      # Set these to chat through Cloudflare Workers AI instead of Ollama.
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_MODEL=${CLOUDFLARE_MODEL:-}
      - CLOUDFLARE_FALLBACK_MODEL=${CLOUDFLARE_FALLBACK_MODEL:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - APP_URL=${APP_URL:-}
      - LEGAL_OPERATOR_NAME=${LEGAL_OPERATOR_NAME:-}
      - LEGAL_CONTACT_EMAIL=${LEGAL_CONTACT_EMAIL:-}
    ports:
      - "100.84.226.15:3200:3000"  # tailnet only, for testing without the tunnel
    volumes:
      # The old SQLite file, kept for the one-off copy into Postgres (scripts/sqlite-to-postgres.mjs).
      # Safe to remove once the copy is verified.
      - dreamchat-data:/app/data

  db:
    image: postgres:16-alpine
    container_name: dreamchat-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-longrak}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-longrak}
    volumes:
      - dreamchat-pg:/var/lib/postgresql/data   # accounts, chats, catalog, billing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No ports: only the app reaches it, over the compose network.

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dreamchat-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    profiles: [tunnel]             # start with: docker compose --profile tunnel up -d

volumes:
  dreamchat-data:
  dreamchat-pg:
